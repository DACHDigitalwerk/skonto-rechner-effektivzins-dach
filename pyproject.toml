[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skonto-dach"
version = "1.0.0"
authors = [
  { name="DACH Digitalwerk", email="kontakt@dach-digitalwerk.netlify.app" },
]
description = "DACH Skonto-, Zahlungsziel- & Lieferantenkredit-Rechner 2026: Exakte Effektivzinsformel, Kontokorrent-Vergleich & Vorsteuerkorrektur (§ 17 UStG / Art. 41 MWSTG)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
]
keywords = [
    "skonto", "effektivzins", "lieferantenkredit", "kontokorrentkredit", 
    "vorsteuerkorrektur", "ustg", "buchhaltung", "treasury", "finanzmathematik", 
    "dach", "python", "cli"
]

[project.urls]
"Homepage" = "https://dach-digitalwerk.netlify.app/skonto-rechner-effektivzins/"
"Bug Tracker" = "https://github.com/DACHDigitalwerk/skonto-rechner-effektivzins-dach/issues"

[project.scripts]
dach-skonto = "skonto_dach.cli:main"
